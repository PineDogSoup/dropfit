<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - DropFit</title>
    <meta name="description" content="CrossFit场馆搜索结果">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/utils.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button id="backBtn" class="text-gray-600 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-sm text-gray-600">城市:</span>
                            <span id="currentCity" class="font-medium text-gray-900">-</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm text-gray-600">关键词:</span>
                            <span id="currentKeyword" class="font-medium text-gray-900">-</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm text-gray-600">结果:</span>
                            <span id="resultCount" class="font-medium text-blue-600">0</span>
                            <span class="text-sm text-gray-600">个场馆</span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 加载状态 -->
        <div id="loadingState" class="hidden">
            <div class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-4 text-gray-600">正在搜索场馆...</p>
            </div>
        </div>

        <!-- 无结果状态 -->
        <div id="noResults" class="hidden">
            <div class="text-center py-12">
                <div class="text-6xl mb-4">🔍</div>
                <h3 class="text-xl font-semibold text-gray-900 mb-2">未找到相关场馆</h3>
                <p class="text-gray-600 mb-6">请尝试调整搜索条件或选择其他城市</p>
                <button id="backToHome" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    返回首页
                </button>
            </div>
        </div>

        <!-- 场馆列表 -->
        <div id="venueList" class="venue-grid venue-grid-mobile">
            <!-- 场馆卡片将通过JavaScript动态生成 -->
        </div>

        <!-- 分页控件 -->
        <div id="pagination" class="mt-8 flex justify-center">
            <div class="flex items-center space-x-2">
                <button id="prevBtn" class="px-3 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <div id="pageNumbers" class="flex items-center space-x-1">
                    <!-- 页码将通过JavaScript动态生成 -->
                </div>
                <button id="nextBtn" class="px-3 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- 场馆卡片模板 -->
    <template id="venueCardTemplate">
        <div class="venue-card bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow border border-gray-200 overflow-hidden">
            <div class="flex flex-col">
                <!-- 场馆信息头部 -->
                <div class="flex items-center justify-between p-4 pb-2">
                    <div class="flex items-center">
                        <!-- 场馆LOGO -->
                        <img class="w-6 h-6 object-contain venue-image mr-3" src="" alt="" onerror="this.style.display='none'">
                        <!-- 场馆名称 -->
                        <h3 class="text-lg font-semibold text-gray-900 venue-name"></h3>
                    </div>
                    
                    <!-- 场馆类型标签 -->
                    <div class="flex flex-col gap-1 venue-type-tags">
                        <!-- 标签将通过JavaScript动态生成 -->
                    </div>
                </div>
                
                <!-- 场馆详细信息 -->
                <div class="px-4 pb-4">
                    <!-- 场馆描述 -->
                    <p class="text-sm text-gray-600 mb-3 venue-description"></p>
                    
                    <!-- 联系信息 -->
                    <div class="space-y-2 mb-3 venue-contact-info">
                        <div class="flex items-center text-sm text-gray-600">
                            <img src="data/images/icons/marker_icon.png" alt="地址" class="w-4 h-4 mr-2">
                            <span class="venue-address"></span>
                        </div>
                        
                        <div class="flex items-center text-sm text-gray-600 venue-phone-row">
                            <img src="data/images/icons/venue_phone.png" alt="电话" class="w-4 h-4 mr-2">
                            <span class="venue-phone"></span>
                        </div>
                        
                        
                        <div class="flex items-center text-sm text-gray-600 venue-official-account-row hidden">
                            <img src="data/images/icons/venue_service.png" alt="公众号" class="w-4 h-4 mr-2">
                            <span class="venue-official-account"></span>
                        </div>
                        
                        <div class="flex items-center text-sm text-gray-600 venue-xiaohongshu-row hidden">
                            <img src="data/images/icons/xhs.png" alt="小红书" class="w-4 h-4 mr-2">
                            <span class="venue-xiaohongshu"></span>
                        </div>
                    </div>
                    
                    <!-- 场馆特色 -->
                    <div class="flex flex-wrap gap-2 venue-features">
                        <!-- 特色标签将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="js/search.js"></script>
</body>
</html>
