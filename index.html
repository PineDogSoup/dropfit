<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFit - CrossFit场馆查找</title>
    <meta name="description" content="查找您身边的CrossFit场馆，覆盖北京、上海、广州、深圳、长沙、昆明、成都等城市">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <!-- 腾讯地图 API GL -->
    <script src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 顶部横幅 -->
    <div class="w-full overflow-hidden">
        <img src="./data/images/slogan.jpg" alt="DropFit Slogan" class="w-full h-auto object-cover object-center" style="height: 200px; object-position: 0 85%;">
    </div>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 pt-8 pb-1">
        <!-- 搜索区域 -->
        <section class="search-section relative z-20 mb-2 -mt-16">
            <!-- 搜索框 -->
            <div class="mb-4 overflow-hidden rounded-2xl bg-white pb-3 pt-0 shadow-md md:pb-4">
                <div class="relative h-12 overflow-hidden bg-[#cfd2d8]">
                    <button
                        id="domesticTag"
                        class="absolute inset-y-0 left-0 z-10 w-1/2 bg-white text-base font-normal text-blue-600"
                        type="button"
                    >
                        国内
                    </button>
                    <button
                        id="overseasTag"
                        class="absolute inset-y-0 right-0 w-1/2 bg-[#eef1f5] px-4 text-base font-normal text-gray-700"
                        type="button"
                    >
                        国际
                    </button>
                    <div
                        aria-hidden="true"
                        class="pointer-events-none absolute left-1/2 top-1/2 h-6 w-px -translate-x-1/2 -translate-y-1/2 bg-white/80"
                    ></div>
                </div>

                <div class="mt-3 space-y-3 px-2 md:px-3">
                    <div class="relative">
                        <button
                            id="cityBtn"
                            class="absolute left-4 top-1/2 z-10 flex -translate-y-1/2 transform cursor-pointer items-center gap-2 text-gray-600 hover:text-gray-700"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            <span id="currentCityName" class="text-base font-semibold">北京</span>
                        </button>
                        <div class="absolute left-20 top-1/2 -translate-y-1/2 transform text-lg text-gray-300">|</div>
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="输入场馆名称"
                            class="w-full rounded-xl border-0 bg-white py-3 pl-32 pr-4 text-base focus:border-transparent focus:ring-2 focus:ring-blue-500"
                        >
                        <div class="absolute left-24 top-1/2 -translate-y-1/2 transform text-gray-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                    </div>

                    <button
                        id="searchBtn"
                        class="w-full rounded-xl bg-[#0076F6] px-6 py-2.5 text-base text-white transition-colors hover:bg-[#006add]"
                    >
                        搜索
                    </button>
                </div>
            </div>

            <!-- 地图容器 -->
            <div class="mb-2">
                    <div class="relative">
                        <div id="mapVenueCountBadge" class="absolute top-3 left-1/2 -translate-x-1/2 z-20 bg-white/95 text-gray-800 text-sm font-medium px-3 py-1.5 rounded-full shadow">
                            场馆收录：0
                        </div>
                        <div id="mapLoading" class="absolute inset-0 bg-gray-100 rounded-lg flex items-center justify-center z-10">
                            <div class="text-center">
                                <div class="animate-spin w-8 h-9 border-4 border-blue-600 border-t-transparent rounded-full mx-auto mb-2"></div>
                                <p class="text-gray-600 text-sm">地图加载中...</p>
                            </div>
                        </div>
                        <div id="mapContainer" class="w-full h-100 bg-gray-200 rounded-lg overflow-hidden"></div>
                    </div>
            </div>

        </section>
    </main>

    <!-- 页脚 -->
    <footer class="relative z-30 bg-gray-800 text-white py-3 mt-0">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- 关于我们 -->
                <div>
                    <h3 class="text-lg font-bold mb-1">关于 DropFit</h3>
                    <p class="text-gray-300 text-sm mb-1">
                        无偿、自发、为爱发电
                    </p>
                    <p class="text-gray-300 text-sm mb-2">
                        为🇨🇳体能爱好者提供最全面的场馆信息，已收录132家场馆
                    </p>
                    <p class="text-gray-300 text-sm mb-3">
                        如果信息有误或者需要信息补充，请联系我（wx:Tacenee）
                    </p>
                </div>

                <!-- 合作伙伴 -->
                <!-- <div>
                    <h3 class="text-lg font-bold mb-4">合作伙伴</h3>
                    <div class="bg-gray-700 rounded p-3 text-center text-sm text-gray-300">
                        CrossFit HQ
                    </div>
                </div> -->
            </div>

            <!-- 版权信息 -->
            <div class="border-t border-gray-700 mt-4 pt-3 text-center">
                <p class="text-gray-400 text-sm">
                    ©2026 DropFit - 专注体能场馆信息 | All Rights Reserved
                </p>
            </div>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/performance.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
