<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场馆详情 - DropFit</title>
    <meta name="description" content="CrossFit场馆详细信息">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/utils.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button id="backBtn" class="text-gray-600 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <h1 class="text-xl font-bold text-gray-900">场馆详情</h1>
                </div>
            </div>
        </nav>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 加载状态 -->
        <div id="loadingState" class="hidden">
            <div class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-4 text-gray-600">正在加载场馆信息...</p>
            </div>
        </div>

        <!-- 场馆不存在状态 -->
        <div id="venueNotFound" class="hidden">
            <div class="text-center py-12">
                <div class="text-6xl mb-4">🏋️</div>
                <h3 class="text-xl font-semibold text-gray-900 mb-2">场馆信息不存在</h3>
                <p class="text-gray-600 mb-6">抱歉，未找到该场馆的详细信息</p>
                <button id="backToSearch" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    返回搜索
                </button>
            </div>
        </div>

        <!-- 场馆详情 -->
        <div id="venueDetail" class="hidden">
            <!-- 场馆信息 -->
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 id="venueName" class="text-2xl font-bold text-gray-900 mb-2"></h2>
                        </div>
                    </div>

                    <p id="venueDescription" class="text-gray-600 mb-6"></p>

                <!-- 联系信息 -->
                <div class="space-y-4 mb-6">
                    <div class="flex items-center">
                        <img src="data/images/icons/marker_icon.png" alt="地址" class="w-4 h-4 mr-2">
                        <span id="venueAddress" class="text-gray-700"></span>
                    </div>
                    
                    <div class="flex items-center">
                        <img src="data/images/icons/venue_phone.png" alt="电话" class="w-4 h-4 mr-2">
                        <span id="venuePhone" class="text-gray-700"></span>
                    </div>
                </div>

            <!-- 场馆特色 -->
            <section class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">场馆特色</h3>
                <div id="venueFeatures" class="flex flex-wrap gap-2">
                    <!-- 特色标签将通过JavaScript动态生成 -->
                </div>
            </section>

            <!-- 课程标签 -->
            <section class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">课程类型</h3>
                <div id="venueCourses" class="flex flex-wrap gap-2">
                    <!-- 课程标签将通过JavaScript动态生成 -->
                </div>
            </section>
        </div>
    </main>

    <script src="js/venue.js"></script>
</body>
</html>
