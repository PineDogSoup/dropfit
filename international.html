<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFit International - 海外 CrossFit 场馆</title>
    <meta name="description" content="DropFit 国际版 CrossFit 场馆搜索，首期支持泰国与韩国。">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-gradient-to-r from-sky-600 to-blue-700 text-white">
        <div class="container mx-auto px-4 pb-[6rem] pt-3">
            <div class="flex items-center justify-between">
                <button id="backBtn" class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white/15 text-white/90 hover:bg-white/20 hover:text-white" aria-label="返回首页">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <span class="rounded-full bg-white/15 px-3 py-1 text-xs tracking-wide">INTERNATIONAL</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto -mt-[5.5rem] px-4 pb-5 space-y-4">
        <section class="relative z-10 rounded-2xl bg-white p-4 shadow-sm">
            <div class="grid grid-cols-2 gap-3">
                <label class="block">
                    <span class="mb-1 block text-sm text-gray-600">国家</span>
                    <select id="countrySelect" class="w-full rounded-xl border-gray-200 text-sm focus:border-blue-500 focus:ring-blue-500"></select>
                </label>
                <label class="block">
                    <span class="mb-1 block text-sm text-gray-600">城市</span>
                    <select id="citySelect" class="w-full rounded-xl border-gray-200 text-sm focus:border-blue-500 focus:ring-blue-500"></select>
                </label>
            </div>
            <div class="mt-3 grid grid-cols-[1fr_auto] gap-3">
                <label class="block min-w-0">
                    <span class="mb-1 block text-sm text-gray-600">关键词</span>
                    <input id="keywordInput" type="text" placeholder="例如：Gangnam" class="h-12 w-full rounded-xl border-gray-200 text-sm focus:border-blue-500 focus:ring-blue-500">
                </label>
                <div class="self-end">
                    <button id="searchBtn" class="inline-flex h-12 items-center justify-center rounded-xl bg-[#0076F6] px-5 text-base text-white hover:bg-[#006add]">搜索</button>
                </div>
            </div>
        </section>

        <section class="rounded-2xl bg-white p-3 shadow-sm">
            <div id="intlMap" class="h-[52vh] min-h-[360px] w-full rounded-xl bg-gray-100"></div>
        </section>

        <section class="rounded-2xl bg-white p-4 shadow-sm">
            <h3 class="mb-3 text-sm font-medium text-gray-700">结果预览</h3>
            <div id="resultList" class="space-y-2"></div>
        </section>
    </main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="js/international.js"></script>
</body>
</html>
